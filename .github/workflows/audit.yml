name: Audit

# Decay, as opposed to drift.
#
# ci.yml gates what a change introduces. This looks for what rots without one: a
# path that was correct until a file moved, a URL that was live until DNS changed, a
# version that was current until a release. No pull request causes any of those, so
# no per-pull-request gate can find them.
#
# Two triggers, because the two failure modes have different clocks.
#
#   schedule       the first of each month. Catches decay that arrives with no
#                  commit at all — the class a commit-triggered gate is blind to by
#                  construction. A dead apex domain sat in this estate for weeks and
#                  every character of the sentence naming it still parsed.
#
#   push to main   but only once five commits have accumulated since the last audit.
#                  Running on every push would be noise: the guard reads documents,
#                  and documents do not change on most commits. Five is a batch size
#                  rather than a threshold of concern.
#
# The marker is a lightweight tag, `audit-<sha>`. Tag writing is deliberately
# non-fatal: if the token cannot push a tag the audit still runs, and the only
# consequence is that it runs again sooner than it needed to. A gate that fails
# because its bookkeeping failed teaches people to ignore it.

on:
  schedule:
    # 09:14 UTC on the 1st. Not midnight and not on the hour: every scheduled
    # workflow on the platform asks for 0 0, and GitHub drops runs under load.
    - cron: '14 9 1 * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if fewer than five commits have accumulated'
        type: boolean
        default: false

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. The one write — the audit tag — is done by a job of its
# own at the end, so the token that can push is never in the job that runs
# `pnpm install` and the network-facing decay check.
permissions:
  contents: read

jobs:
  decide:
    name: Is an audit due?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      due: ${{ steps.count.outputs.due }}
      since: ${{ steps.count.outputs.since }}
    steps:
      # Full history: `git describe` cannot find a tag in a shallow clone, and the
      # commit count would be wrong rather than absent.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - id: count
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "since=n/a — ${{ github.event_name }}" >> "$GITHUB_OUTPUT"
            echo "Running: ${{ github.event_name }}."
            exit 0
          fi

          last=$(git tag --list 'audit-*' --sort=-creatordate | head -1)
          if [ -z "$last" ]; then
            n=$(git rev-list --count HEAD)
            echo "No audit tag yet; $n commits in history."
          else
            n=$(git rev-list --count "$last"..HEAD)
            echo "$n commit(s) since $last."
          fi

          echo "since=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 5 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Fewer than five commits since the last audit. Nothing to do."
          fi

  audit:
    name: Paths, scripts, guards, URLs, pin
    needs: decide
    if: needs.decide.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # node-version-file rather than a literal, matching the publish job in
      # ci.yml, so .nvmrc is the one line that says what this package is built
      # and audited on.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      - name: Decay
        run: pnpm check:decay

  # Only on a clean audit. A tag written after a failure would suppress the next
  # five commits' worth of checking on the strength of a run that found problems.
  # Non-fatal, as the header says: a gate that fails because its bookkeeping
  # failed teaches people to ignore it.
  record:
    name: Record the audit
    needs: [decide, audit]
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - env:
          TRIGGER: ${{ github.event_name }}
          SINCE: ${{ needs.decide.outputs.since }}
        run: |
          set -euo pipefail
          tag="audit-$(git rev-parse --short HEAD)"
          git tag -f "$tag"
          git push origin "$tag" --force
          echo "Recorded $tag (trigger: $TRIGGER, commits since last: $SINCE)."
