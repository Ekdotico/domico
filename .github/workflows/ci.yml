name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. `verify` runs `pnpm install`, and pnpm executes
# dependency lifecycle scripts, so its token holds nothing worth taking. The
# `publish` job states the write scopes it needs on its own.
permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    # Both ends of engines.node, because the range is a claim about each. 26 is
    # what .nvmrc pins and what this package is built and published on; 24 is
    # the floor, kept because deree and the documentation site deploy on Vercel,
    # which offers 24 at most, and the guards run there through ekdotico-check.
    # Without the second row the floor would be a line in package.json that
    # nothing had run.
    #
    # fail-fast is off so that a fault on one line does not cancel the other
    # and hide whether it is shared. The two numbers are literals, which .nvmrc
    # cannot replace: it holds one version. Every job outside this matrix reads
    # .nvmrc instead.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      # Build first, so the checks below compare committed artefacts against a
      # real rebuild rather than against nothing.
      - name: Build
        run: pnpm build

      # Fails if a generated token artefact was edited by hand, or if the token
      # source changed without a rebuild.
      - name: Generated token artefacts are in sync with the source
        run: pnpm check:generated

      # Fails if the prose guidelines and the structured expression data
      # disagree, including the case both files claim the same version while
      # saying different things.
      - name: Expression data is in sync with the guidelines
        run: pnpm check:expression

      # `files` and `exports` are maintained separately, so a subpath can point
      # at a path that ships in nobody's node_modules. That failure appears
      # only in a consuming repository, after publish, as an import that does
      # not resolve — which is the worst place to find it.
      - name: Every exported subpath ships in the tarball
        run: pnpm check:exports

      # Icons are vendored, so conformance is a convention rather than
      # something the package manager enforces. This is what makes the
      # convention enforceable — it caught ModeSwitcher shipping its own
      # hand-drawn sun, monitor and moon alongside the Lucide ones.
      - name: Vendored icons match their Lucide originals
        run: pnpm check:icons

      # The bootstrap runs before React and before any stylesheet, so a defect
      # in it is a full-page colour flash or an unstyled document. It is a
      # string, so nothing else would catch a mistake in it.
      - name: Appearance resolution and bootstrap
        run: pnpm check:appearance

      # Contrast was asserted in prose and checked by hand, which is how
      # --accent-ink shipped at 3.22:1 on Parchment dark. Every foreground is
      # now measured against the surface it is actually drawn on.
      - name: Colour pairs meet WCAG AA
        run: pnpm check:contrast

      # components.css shipped unparseable from 0.1.0 to 0.4.0 and nothing
      # noticed, because no consumer had ever imported it. A stylesheet nobody
      # imports is a stylesheet nobody validates.
      - name: Shipped stylesheets parse
        run: pnpm check:styles

      # Asserts the linter fails when it should and, more importantly, stays
      # quiet where it should: false positives are what get a linter switched
      # off, and the structural exemptions would rot silently without this.
      - name: Linter behaves as specified
        run: pnpm lint:fixture

      # The guidelines must pass their own rules. A governing document that
      # violates its own prohibitions undermines every enforcement action taken
      # under it.
      - name: Package copy is compliant
        run: pnpm lint:copy

      - name: Types
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # A build that leaves the working tree dirty means something is generated
      # but not committed. Catch it here rather than at publish.
      - name: Working tree is clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build modified committed files:"
            git status --porcelain
            git diff
            exit 1
          fi

  publish:
    name: Publish to GitHub Packages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # For the dispatch at the end of this job, and nothing else.
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens or updates a release pull request while changesets are pending;
      # publishes once that pull request is merged. Nothing is published from
      # a commit that carries no changeset.
      - name: Release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm exec changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # consumers.yml declares a `release: published` trigger that has never once
      # fired. changesets/action creates the GitHub Release with GITHUB_TOKEN, and
      # events created by that token do not start workflow runs — so "who is still
      # on the old version" went unasked after every release since that workflow
      # landed, and nothing anywhere went red, which is the exact silence it was
      # written to break. Dispatching it here asks from the one place that knows a
      # publish just happened, and `workflow_dispatch` is one of the two documented
      # exceptions to the anti-recursion rule that silenced the release trigger.
      - name: Ask who is still behind
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run consumers.yml --repo "$GITHUB_REPOSITORY"
