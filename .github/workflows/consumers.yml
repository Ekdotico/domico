name: Consumers

# Who is still on the old package.
#
# ci.yml gates what a change to THIS repository introduces. audit.yml looks for
# what rots here without a commit. Neither can see the failure this one looks
# for, because it does not happen here at all: a version is published, every
# consuming repository carries on pinned to what it had, and nothing anywhere
# goes red. The estate has already paid for that once — three applications
# migrated onto this package and none updated its written account afterwards,
# and by the time it surfaced the stale documents were instructing agents to
# reintroduce the faults they described.
#
# It opens an issue. It does not open a pull request bumping anybody's pin, and
# that is the load-bearing decision rather than a limitation. Every consumer
# pins exactly on purpose: a floating range would let an unreviewed visual
# change reach an application through a routine install, bypassing the
# four-theme review gate their specifications require. A bot that bumps the pin
# automates past exactly the gate the exact pin exists to hold. A person is
# meant to read this, look at four themes in two modes, and decide.
#
# Three triggers, because the question has three occasions.
#
#   release        the moment the answer changes. changesets/action in ci.yml
#                  creates a GitHub Release when it publishes, so this fires
#                  once per published version and no more.
#
#   schedule       the backstop, monthly. If the release event is ever missed —
#                  the action's createGithubReleases turned off, a publish done
#                  by hand — the release trigger goes quiet with no symptom, and
#                  quiet is indistinguishable from healthy. A gate whose only
#                  trigger can fail silently is not a gate.
#
#   dispatch       for asking on purpose, and for the first run before any
#                  release exists to fire on.
#
# SETUP REQUIRED BEFORE THE FIRST RUN — one repository secret:
#
#   EKDOTICO_SUITE_TOKEN   A fine-grained personal access token, or a GitHub App
#                          installation token, scoped to ALL repositories in the
#                          Ekdotico organisation with two read permissions:
#                          Metadata (read) and Contents (read). Nothing more —
#                          this only ever reads package.json.
#
#                          It cannot be GITHUB_TOKEN. That token is scoped to
#                          the repository the workflow runs in, so it can see
#                          domico and nothing else, and a run using it reports
#                          every consumer as unreadable. The script exits rather
#                          than treating that as "nobody is behind", because a
#                          permissions failure that reads as a clean bill of
#                          health is the most expensive way for this to be
#                          wrong.
#
#                          The issue itself is written with GITHUB_TOKEN, which
#                          is scoped to this repository and is the right token
#                          for that half.

on:
  release:
    types: [published]
  schedule:
    # 09:37 UTC on the 3rd. Two days after audit.yml, so a month that runs both
    # does not open two reports on the same morning; not on the hour, because
    # every scheduled workflow on the platform asks for 0 0 and GitHub drops
    # runs under load.
    - cron: '37 9 3 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Measure against this version instead of package.json'
        type: string
        required: false

concurrency:
  group: consumers
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  consumers:
    name: Consumer pins against the published version
    runs-on: ubuntu-latest
    steps:
      # The default branch rather than the release tag. package.json on main is
      # the version that was just published — changesets commits the bump before
      # it publishes — and it is also the right answer for the scheduled run,
      # which has no tag of its own.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # setup-node v5 turns the package-manager cache on by default, detects
          # pnpm from the lockfile, and runs `pnpm store path` to find the cache
          # directory. This job installs no pnpm on purpose, so that lookup fails
          # the step before the script is ever reached. v4 only cached when asked
          # to, which is why the move to v5 left this job broken and silent: the
          # workflow had no working trigger at the time, so nothing ran it until
          # the publish dispatch landed.
          package-manager-cache: false

      # No install. The script has no dependencies and uses the global fetch
      # Node 22 ships, so a lockfile install here would only add a minute and a
      # registry that can be down.
      - name: Read every consumer's pin
        id: pins
        env:
          EKDOTICO_SUITE_TOKEN: ${{ secrets.EKDOTICO_SUITE_TOKEN }}
          # Through the environment, never interpolated into the script: a
          # dispatch input is free text, and an expression expanded into `run:`
          # is shell for whoever typed it.
          VERSION: ${{ inputs.version }}
        run: |
          # `pipefail`, because the pipe into `tee` is the last command in this
          # pipeline and its exit status is the step's. Without it the script's
          # `exit 1` on a missing token was discarded, the step went green with
          # no report written, and the absent file was then read below as "every
          # consumer is current" — a token fault reported as a clean bill of
          # health, which is the one outcome check-consumers.mjs exits to avoid.
          set -euo pipefail

          node scripts/check-consumers.mjs \
            --out "$RUNNER_TEMP/consumers.md" \
            ${VERSION:+--version "$VERSION"} \
            | tee "$RUNNER_TEMP/consumers.log"

          # `hashFiles` cannot answer this question. It resolves paths only
          # inside GITHUB_WORKSPACE, and the report is written to RUNNER_TEMP,
          # so it returned the empty string whether or not the file existed —
          # which skipped the open step and ran the close step on every run
          # since this workflow was written. `test -s` is what the script's own
          # docstring specifies, and it reads the file where it actually is.
          if test -s "$RUNNER_TEMP/consumers.md"; then
            echo 'behind=true' >> "$GITHUB_OUTPUT"
          else
            echo 'behind=false' >> "$GITHUB_OUTPUT"
          fi

      # The script writes nothing when every consumer is current, so the report's
      # existence is the whole signal, carried here as a step output. It exits 0
      # either way on purpose: a stale consumer is the normal state for the hours
      # after a release, and a workflow that goes red on the normal state is one
      # people learn to ignore. A fault of its own — no token, the API refusing —
      # is a non-zero exit, and now fails the step above rather than arriving here
      # dressed as good news.
      - name: Open or update the tracking issue
        if: steps.pins.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Consumers behind $(node -p "require('./package.json').name")"

          # One issue, reused. A new issue per release would be a mailing list
          # rather than a work item, and the thing being tracked — "the estate
          # is not on one version" — is a single ongoing state, not an event.
          #
          # Matched on the exact title, not with --search: the search parser
          # reads the "@ekdotico/domico" in the title as a qualifier and returns
          # nothing, so every run filed a new issue (#29 to #53) and the close
          # step below never found one to close.
          existing=$(gh issue list --state open --limit 200 --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/consumers.md"
            gh issue comment "$existing" --body "Rechecked on \`${{ github.event_name }}\`. The description above is current as of $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo "Updated #$existing."
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/consumers.md"
          fi

      # Closing it is as important as opening it. An issue that stays open after
      # the work is done teaches people that the issue does not mean anything.
      - name: Close the tracking issue once every consumer is current
        if: steps.pins.outputs.behind == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Consumers behind $(node -p "require('./package.json').name")"
          # Exact title, for the reason given in the step above.
          existing=$(gh issue list --state open --limit 200 --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every consumer is on the published version."
            echo "Closed #$existing."
          else
            echo "Every consumer is current, and there was no open issue."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/consumers.log" 2>/dev/null || echo 'The check did not run.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
