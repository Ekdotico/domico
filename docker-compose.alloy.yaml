services:
  ruleset:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace:ro
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      IS_ALLOY: ${IS_ALLOY:-true}
    command: ["node", ".alloy/serve-ruleset.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
